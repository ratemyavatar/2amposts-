tle":"Video verwijderd","vid_mod_analytics_appeal_detail_pg_desc":"Deze video schendt onze Communityrichtlijnen.","vidModAnalytics_appealSubmitted_sectionTitle_header":"Verzoek ontvangen","vid_mod_analytics_appeal_rcv_detail_pg_desc":"We hebben je verzoek ontvangen en laten je het weten wanneer het resultaat van je bezwaar beschikbaar is.","vid_mod_analytics_penalty_reason_minor_title":"Veiligheid van minderjarigen","vid_mod_analytics_penalty_reason_minor_desc":"Om tieners extra ruimte te bieden voor het verkennen van de identiteit en expressie in digitale omgevingen, komt content die is geüpload door gebruikers onder de 16 niet in aanmerking voor aanbeveling. Het promoten van plastische chirurgie bij minderjarigen kan leiden tot meer ontevredenheid over het lichaam. Daarom komt dergelijke content - waaronder voor-en-na-video's, video's van chirurgische ingrepen en berichten waarin facultatieve plastische chirurgie wordt besproken zonder waarschuwing voor de risico's - niet in aanmerking voor de 'Voor jou'-feed van alle gebruikers onder de 18 jaar.","vid_mod_analytics_penalty_reason_unoriginal_title":"Niet-originele, laagwaardige en QR-codecontent","vid_mod_analytics_penalty_reason_unoriginal_desc":"Om TikTok positief en plezierig te houden voor onze gebruikers, komt content die niet origineel of van lage kwaliteit is niet in aanmerking voor aanbeveling. Niet-originele content omvdat video's die slechts zijn geïmporteerd of gekopieerd van andere bronnen (zoals andere platformen, tv-programma's of webcasts) zonder nieuwe, creatieve bewerkingen. We kunnen zien dat een video niet-origineel is als deze een watermerk of logo bevat. Content van lage kwaliteit omvat zeer korte video's, statische afbeeldingen en video's die alleen uit GIF's bestaan. Content die QR-codes bevat, komt meestal niet in aanmerking voor de 'Voor jou'-feed, omdat deze gebruikers naar schadelijke websites of apps kunnen leiden, hoewel we uitzonderingen maken in omstandigheden waarin het risico laag is (bijvoorbeeld voor e-commerce).","vid_mod_analytics_nr_vid_penalty_reason_unoriginal_title":"Niet-originele, laagwaardige en QR-codecontent","vid_mod_analytics_nr_vid_penalty_reason_unoriginal_desc":"Om de positieve ervaring te behouden die onze gebruikers van het TikTok-platform verwachten, komt content die niet origineel of van lage kwaliteit is niet in aanmerking voor aanbeveling. Niet-originele content is content die slechts is geïmporteerd of gekopieerd van andere bronnen zonder nieuwe, creatieve bewerkingen. Een video kan niet-origineel zijn als deze een watermerk of logo bevat. Content van lage kwaliteit omvat zeer korte video's, statische afbeeldingen en video's die alleen uit GIF's bestaan.","vid_mod_analytics_nr_acct_penalty_reason_unoriginal_title":"Gereproduceerd account","vid_mod_analytics_nr_acct_penalty_reason_unoriginal_desc":"Je account bevat berichten die niet origineel zijn en niet in aanmerking komen voor de 'Voor jou'-feed. Zie onze Communityrichtlijnen voor meer informatie \u003E Niet geschikt voor de 'Voor jou'-feed \u003E Niet-originele, laagwaardige en QR-codecontent","vid_mod_analytics_penalty_reason_spam_title":"Spam, niet-authentieke, of misleidende content","vid_mod_analytics_penalty_reason_spam_desc":"Content die probeert gebruikers te misleiden of te manipuleren om meer volgers, likes, weergaven of andere interactiemetrieken op het platform te krijgen, komt niet in aanmerking voor de 'Voor jou'-feed. Dit omvat content die gebruikers aanmoedigt om elkaar te volgen of te liken, of content die gebruikers verleidt om op like- of deelknoppen te klikken. Bovendien komt content die samenzweringstheorieën promoot en valse of schadelijke informatie over actuele gebeurtenissen verspreidt waarvan de details zich nog ontwikkelen, niet in aanmerking voor de 'Voor jou'-feed.","vid_mod_analytics_penalty_reason_sexual_title":"Zeer seksueel getinte content","vid_mod_analytics_penalty_reason_sexual_desc":"Om een comfortabele ervaring te waarborgen, komt content die duidelijk seksueel suggestief is, niet in aanmerking voor aanbeveling. Dit omvat content die impliciete naaktheid toont, lichaamsdelen seksualiseert of overduidelijk erotisch of sensueel is (bijvoorbeeld stripteases).","vid_mod_analytics_penalty_reason_tobacco_title":"Tabaks- en alcoholproducten","vid_mod_analytics_penalty_reason_tobacco_desc":"Content die alcoholproducten promoot, vermeldt of afbeeldt terwijl ze worden geconsumeerd door personen die de wettelijke leeftijd hebben om te drinken, maar de producten op een gevaarlijke manier gebruiken, komt niet in aanmerking voor aanbeveling. Content waarin het gebruik van tabaksproducten door volwassenen wordt afgebeeld of waarin gereguleerde stoffen worden vermeld, komt niet in aanmerking voor aanbeveling.","vid_mod_analytics_penalty_reason_stunts_title":"Gevaarlijke stunts en sporten","vid_mod_analytics_penalty_reason_stunts_desc":"Wanneer bepaalde activiteiten zonder veiligheidsmaatregelen worden nagebootst, kunnen ze riskant of gevaarlijk zijn, wat kan leiden tot lichamelijk letsel. Content met gevaarlijke stunts of extreme sporten uitgevoerd door niet-professionals kan niet in aanmerking komen.","vid_mod_analytics_penalty_reason_graphic_title":"Gewelddadige en grafische content","vid_mod_analytics_penalty_reason_graphic_desc":"Content die kijkers ongemak, schok of afschuw bezorgt, komt mogelijk niet in aanmerking voor de 'Voor jou'-feed. Dit is content met onder andere schrikeffecten, jump scares, make-up die bloederige wonden realistisch nabootst en het uitbeelden van lichaamsfuncties. De meeste gewelddadige en grafische content is niet toegestaan op TikTok. We kunnen echter bepaalde soorten content toestaan, zoals afbeeldingen van sterfgevallen, ongelukken of gevechten, wanneer dat dient als documentatie van echte gebeurtenissen en wordt geacht in het algemeen belang te zijn. Omdat deze content mogelijk niet comfortabel is voor elke doelgroep, komt deze niet in aanmerking voor aanbeveling en zal de content een 'opt-in'-scherm of waarschuwing hebben.","vid_mod_analytics_penalty_reason_fyf_title":"Komt niet in aanmerking voor de 'Voor jou'-feed","vid_mod_analytics_penalty_reason_fyf_desc":"Je video voldoet niet aan onze criteria om in aanmerking te komen voor de 'Voor jou'-feed. Zie de Communityrichtlijnen van TikTok voor meer informatie \u003E Komt niet in aanmerking voor de 'Voor you'-feed","Web_report_thanks_for_report":"Bedankt voor het melden","Web_report_report_detail":"We beoordelen je melding. Als er een overtreding is van onze Communityrichtlijnen, nemen we passende maatregelen.","live_close":"Sluiten","oSA_reportPg_submissionComplete_body":"We beoordelen je melding en ondernemen actie in geval van een schending van onze Communityrichtlijnen of als we van mening zijn dat de gemelde content illegaal is volgens de wetgeving van het Verenigd Koninkrijk. Je wordt geïnformeerd over onze beslissing.","rIC_reportPg_submissionComplete_body":"We beoordelen je melding en ondernemen actie in geval van een schending van onze Communityrichtlijnen, of als we van mening zijn dat de gemelde content illegaal is volgens de Japanse wetgeving. Je wordt geïnformeerd over onze beslissing.","avia_law_report_received_confirm":"We beoordelen je melding en zullen actie ondernemen in geval van een schending van de Franse wet betreffende online haatzaaien (LCEN) of van onze Communityrichtlijnen.","dsa_illegal_report_received_confirm_logout":"We beoordelen je melding en ondernemen actie in geval van een schending van onze Communityrichtlijnen of als we van mening zijn dat de gemelde content illegaal is volgens EU-wetgeving. Je wordt via e-mail geïnformeerd over onze beslissing.","dsa_illegal_report_received_confirm":"We beoordelen je melding en ondernemen actie in geval van een schending van onze Communityrichtlijnen of als we van mening zijn dat de gemelde content illegaal is volgens EU-wetgeving. Je wordt geïnformeerd over onze beslissing.","pm_mt_live_done":"Gereed","Web_rep
